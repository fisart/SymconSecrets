name: System Portal return navigation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP syntax and portal resolver regression
        run: |
          php -l libs/SystemPortalNavigation.php
          php tests/system_portal_navigation.php
      - name: Existing vault and authentication regression
        run: |
          php -l SecretsManager/module.php
          python .migration/tests/reference-regression.py
