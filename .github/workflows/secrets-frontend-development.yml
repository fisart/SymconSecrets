name: Separate secrets frontend and backend
on:
  push:
    branches: [feature/secrets-frontend]
    paths: ['SecretsFrontend/**', 'SecretsBackend/**', '.github/workflows/secrets-frontend-development.yml']
  pull_request:
    paths: ['SecretsFrontend/**', 'SecretsBackend/**', '.github/workflows/secrets-frontend-development.yml']
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, sodium, curl, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install witness test dependency
        run: python -m pip install 'cryptography==50.0.2'
      - name: Check unchanged original code and lint new PHP
        run: |
          python SecretsFrontend/tests/structure.py
          python -c "import pathlib,subprocess; [subprocess.run(['php','-l',str(p)],check=True) for folder in ['SecretsFrontend','SecretsBackend'] for p in pathlib.Path(folder).rglob('*.php')]"
      - name: Run new implementation and fault checks
        run: |
          php SecretsBackend/tests/run.php
          php SecretsBackend/tests/interoperability.php
          php SecretsFrontend/tests/modules.php
          python SecretsBackend/tests/anchor_test.py
      - name: Check frontend wizard DOM
        working-directory: SecretsFrontend/tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Run existing password module regressions unchanged
        run: |
          php tests/PortalSecurityTest.php
          php tests/WebAuthnAssertionTest.php
          php tests/ModuleSecurityRegressionTest.php
          php tests/ModuleStateTest.php
          php tests/system_portal_navigation.php
