name: Separate secrets frontend and backend
on:
  push:
    branches: [feature/secrets-frontend]
    paths: ['SecretsFrontend/**', 'SecretsBackend/**', '.github/workflows/secrets-frontend-development.yml']
  pull_request:
    paths: ['SecretsFrontend/**', 'SecretsBackend/**', '.github/workflows/secrets-frontend-development.yml']
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, sodium, curl, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install witness test dependency
        run: python -m pip install 'cryptography==50.0.2'
      - name: Check unchanged original code and lint new PHP
        run: |
          python SecretsFrontend/tests/structure.py
          python -c "import pathlib,subprocess; [subprocess.run(['php','-l',str(p)],check=True) for folder in ['SecretsFrontend','SecretsBackend'] for p in pathlib.Path(folder).rglob('*.php')]"
      - name: Run new implementation and fault checks
        run: |
          php SecretsBackend/tests/run.php
          php SecretsBackend/tests/interoperability.php
          php SecretsBackend/tests/hardware.php
          php SecretsBackend/tests/audit-races.php
          php SecretsBackend/tests/anchor-responses.php
          php SecretsBackend/tests/runtime-lock.php
          php SecretsBackend/tests/quorum-protocol.php
          php SecretsBackend/tests/quorum-bundle.php
          php SecretsBackend/tests/quorum-intent.php
          php SecretsBackend/tests/ir-runtime.php
          php SecretsBackend/tests/ir-response-bindings.php
          php SecretsFrontend/tests/module-security.php
          php SecretsFrontend/tests/guided-setup.php
          php SecretsFrontend/tests/deployment.php
          python SecretsBackend/tests/anchor_test.py
      - name: Check frontend wizard DOM
        working-directory: SecretsFrontend/tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:security
          npm run test:guided
      - name: Run existing password module regressions unchanged
        run: |
          php tests/PortalSecurityTest.php
          php tests/WebAuthnAssertionTest.php
          php tests/ModuleSecurityRegressionTest.php
          php tests/ModuleStateTest.php
          php tests/system_portal_navigation.php
  quorum-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: SecretsBackend/quorum/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned quorum modules and static checks
        working-directory: SecretsBackend/quorum
        run: |
          go mod verify
          go vet ./...
      - name: Run quorum component and real-process failure tests
        working-directory: SecretsBackend/quorum
        run: |
          go test -race -count=1 -timeout=5m -json ./... | tee "$RUNNER_TEMP/quorum-tests.json"
      - name: Run injected file/rename/directory failure regressions
        # The separate overlay adds syscall failures only to this test build.
        if: always()
        working-directory: SecretsBackend/quorum
        run: python tests/io_faults.py --output "$RUNNER_TEMP/ir-io-tests.json"
      - name: Summarize exact-commit component evidence
        if: always()
        run: python SecretsBackend/quorum/tests/summarize.py "$RUNNER_TEMP/quorum-tests.json" "$RUNNER_TEMP/quorum-evidence.json" "$RUNNER_TEMP/ir-io-tests.json"
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quorum-component-evidence
          path: |
            ${{ runner.temp }}/quorum-tests.json
            ${{ runner.temp }}/quorum-evidence.json
            ${{ runner.temp }}/ir-io-tests.json
